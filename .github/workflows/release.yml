name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Check version matches tag
        run: |
          go build -o gpp ./cmd/gpp
          want="${GITHUB_REF_NAME#v}"
          ./gpp version | grep -q "G++ compiler ${want}$" \
            || { echo "compiler.Version does not match tag ${GITHUB_REF_NAME}"; ./gpp version; exit 1; }

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="gpp_${GITHUB_REF_NAME}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "build/$name/gpp$ext" ./cmd/gpp
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "G++ $GITHUB_REF_NAME" \
            --generate-notes
