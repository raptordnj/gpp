name: Release

# Runs when a v* tag is pushed. It can also be started manually for an
# existing tag to rebuild and replace that release's assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # packaging configuration from the workflow's commit
      - uses: actions/checkout@v4

      # compiler sources from the tag being released
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: src/go.mod

      - name: Test
        working-directory: src
        run: |
          go vet ./...
          go test ./...

      - name: Check version matches tag
        working-directory: src
        run: |
          go build -o gpp ./cmd/gpp
          ./gpp version | grep -q "G++ compiler ${TAG#v}$" \
            || { echo "compiler.Version does not match tag $TAG"; ./gpp version; exit 1; }

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build binaries, archives and Linux packages
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="gpp_${TAG}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            dir="build/$name"
            mkdir -p "$dir"
            (cd src && GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../$dir/gpp$ext" ./cmd/gpp)
            cp src/README.md src/LICENSE "$dir/"

            # portable archives (Windows: .zip, Linux/macOS: .tar.gz)
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi

            # native Linux packages: Debian/Ubuntu (.deb), RHEL/Fedora (.rpm), Arch (.pkg.tar.zst)
            if [ "$os" = linux ]; then
              rm -rf pkgroot && cp -r "$dir" pkgroot
              for packager in deb rpm archlinux; do
                VERSION="$version" GOARCH="$arch" nfpm pkg -f packaging/nfpm.yaml -p "$packager" -t dist/
              done
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "G++ $TAG" --generate-notes
          fi
